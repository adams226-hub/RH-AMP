server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route React (react-router) : toute URL inconnue retombe sur index.html pour que le
    # routage côté client prenne le relais, plutôt qu'un 404 nginx sur un rechargement de page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Application installable (PWA) : le service worker, son enregistrement, le manifeste et la page
    # d'entrée ne doivent jamais être servis depuis un cache — sinon les téléphones resteraient
    # bloqués sur une ancienne version. Les correspondances exactes (=) passent avant la règle
    # « 30 jours » ci-dessous.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
