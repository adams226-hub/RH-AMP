server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route React (react-router) : toute URL inconnue retombe sur index.html pour que le
    # routage côté client prenne le relais, plutôt qu'un 404 nginx sur un rechargement de page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
